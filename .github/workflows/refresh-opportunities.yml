# Refresh Opportunities Board Data
# Runs the scraper, transforms xlsx to JSON, commits, and deploys.
#
# MANUAL SETUP CHECKLIST (for Jose):
# 1. Add GEMINI_API_KEY to repo secrets (Settings > Secrets > Actions)
# 2. Add APIFY_TOKEN to repo secrets
# 3. Add VERCEL_TOKEN to repo secrets (from `vercel tokens create`)
# 4. Copy scraper code into this repo under scraper/ or set up cross-repo dispatch
#    (currently the scraper lives on Google Drive, not in a GitHub repo)
# 5. Ensure the orgs xlsx is accessible from the runner (may need to upload as artifact
#    or store in a separate repo)
#
# NOTE: This workflow is a SKELETON. Steps 2-3 (scraper + transform) require
# the scraper code + dependencies to be accessible from GitHub Actions.
# For now, only the commit + deploy steps are functional after manually running
# the scraper locally and pushing the updated opportunities.json.

name: Refresh Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # Mondays at 07:00 UTC

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: Uncomment when scraper code is in the repo
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      #
      # - name: Install scraper dependencies
      #   run: pip install -r scraper/requirements.txt
      #
      # - name: Run scraper
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      #   run: python scraper/run_local.py --out workspace/latest.xlsx
      #
      # - name: Transform xlsx to JSON
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #   run: python workspace/xlsx_to_json.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/opportunities.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/opportunities.json
          git commit -m "chore: refresh opportunities data $(date +%Y-%m-%d)"
          git push

      - name: Deploy to Vercel
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --yes --token $VERCEL_TOKEN
